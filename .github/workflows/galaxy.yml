name: Update Stargazer Galaxy

on:
  # 有人按星時觸發（watch 只有 started，取消星星要等下次按星或手動觸發才會反映）
  watch:
    types: [started]

  # 手動觸發
  workflow_dispatch:

  # 刻意不設 schedule：公開 repo 的排程 workflow 60 天沒有活動會被自動停用，
  # 停用後連按星都不會觸發

# 避免同時多個 workflow 執行
concurrency:
  group: repo-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    # 只在 star 事件（不是 unstar）或其他觸發方式時執行
    if: github.event_name != 'watch' || github.event.action == 'started'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Pull latest changes
        run: git pull origin main

      - name: Generate galaxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/generate-galaxy.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/galaxy.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✨ Update stargazer galaxy [skip ci]"
            git push
          fi

  # 按星觸發的執行失敗時，GitHub 只通知按星的人、不會通知 repo 擁有者，
  # 所以失敗時開一個 issue（已經有開著的就留言），讓擁有者收到通知
  notify-failure:
    needs: generate
    if: failure()
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Open or comment on failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          title="galaxy 產圖失敗"
          body="觸發方式：${TRIGGER}
          執行紀錄：${RUN_URL}"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
